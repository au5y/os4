[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os4"
version = "0.1.0"
description = "EM.411 OS4: tradespace exploration for an autonomous East Cambridge surface transportation system"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
os4 = "os4.__main__:main"
os4-lab = "os4.lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
os4 = ["site_template/*.html", "site_template/assets/*", "lab/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
