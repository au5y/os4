# Runs the tests and the model on every push/PR and uploads outputs/ (xlsx, CSVs, figures, site)
# as a downloadable artifact. Pushes to main also publish the results explorer (outputs/site)
# to GitHub Pages. Pushing a tag like v1.0-os4 also publishes a GitHub Release with the outputs
# attached (and the input CSVs as os4-inputs.zip), which is the copy to submit. The executable job builds the standalone os4 executable
# (scripts/build_exe.py) on Linux, macOS and Windows, smoke-tests it, uploads it, and attaches it to
# tagged releases.
name: model

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step on tags
    steps:
      # LFS files (assignment PDFs, slides) aren't needed to run the model.
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Test
        run: uv run pytest -q

      - name: Run model
        run: uv run python -m os4

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: os4-outputs-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

      - name: Upload results explorer for GitHub Pages (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr os4-inputs.zip data  # the input CSVs the outputs were generated from
          gh release create "$GITHUB_REF_NAME" \
            os4-inputs.zip outputs/*.md outputs/media/* \
            --title "OS4 model $GITHUB_REF_NAME" --generate-notes

  executable:
    needs: build # the release must exist before the executables are attached to it
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # only used by the release step on tags
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra build

      - name: Build
        run: uv run python scripts/build_exe.py

      - name: Smoke test (Task 1, Task 2 and the Lab's help from the executable)
        run: |
          exe=dist/os4; [ "$RUNNER_OS" = Windows ] && exe=dist/os4.exe
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$exe" --only task1 task2 --out smoke --no-progress
          test -f smoke/task1_cases.md && test -f smoke/task2_model.md
          "$GITHUB_WORKSPACE/$exe" lab --help

      - name: Package
        run: |
          mkdir -p package
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "package/os4-${{ matrix.name }}.zip" ./dist/os4.exe
          else
            tar -czf "package/os4-${{ matrix.name }}.tar.gz" -C dist os4
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: os4-${{ matrix.name }}-${{ github.sha }}
          path: package/*
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" package/* --clobber

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
